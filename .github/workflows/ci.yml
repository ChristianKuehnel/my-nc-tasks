# CI for my-nc-tasks: full quality gate plus build validation.
#
# Scope note: all checks run on Linux and are NOT an iOS native compile.
# They validate the JavaScript bundle (Metro/Hermes), the Expo project
# configuration, and the code quality gate. Native iOS builds are produced
# by EAS (see docs/development.md and the Phase 0.6 issue).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  quality-gate:
    name: quality-gate (format, lint, typecheck, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # The Corepack bundled with Node 22.x is 0.34 and cannot start
      # pnpm 12 (native binary layout); install a current Corepack first.
      # The pnpm version itself is pinned via the packageManager field.
      - name: Install Corepack >= 0.36
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level=high

  expo-doctor:
    name: expo-doctor (Expo project/config validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Corepack >= 0.36
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run expo-doctor
        run: pnpm dlx expo-doctor@latest

  ios-bundle:
    name: ios-bundle (Hermes bundle via expo export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Corepack >= 0.36
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Export iOS bundle
        run: pnpm exec expo export --platform ios --output-dir dist/ios-bundle-ci

      - name: Verify bundle artifact
        run: ls -la dist/ios-bundle-ci/_expo/static/js/ios/
