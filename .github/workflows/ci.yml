# CI for my-nc-tasks: full quality gate plus build validation.
#
# Scope note: all checks run on Linux and are NOT an iOS native compile.
# They validate the JavaScript bundle (Metro/Hermes), the Expo project
# configuration, and the code quality gate. Native iOS builds are produced
# by EAS (see docs/development.md and the Phase 0.6 issue).
#
# Toolchain notes:
# - The Corepack bundled with Node 22.x is 0.34 and cannot start pnpm 12
#   (native binary layout), so a current Corepack is installed explicitly.
#   This happens twice per job: once with the runner image's Node (so
#   actions/setup-node can compute the pnpm store cache key via
#   `pnpm store path`) and once after the pinned Node is on PATH (so the
#   pinned prefix also carries Corepack >= 0.36).
# - The pnpm version itself is always pinned via the packageManager field.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  quality-gate:
    name: quality-gate (format, lint, typecheck, tests, audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Corepack >= 0.36 (runner image Node, for cache key)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Corepack >= 0.36 (pinned Node prefix)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level=high

  expo-doctor:
    name: expo-doctor (Expo project/config validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Corepack >= 0.36 (runner image Node, for cache key)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Corepack >= 0.36 (pinned Node prefix)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate dependencies against the locked Expo SDK
        env:
          EXPO_OFFLINE: '1'
        run: pnpm exec expo install --check

      - name: Validate Expo project and configuration
        env:
          # The preceding required step checks dependency versions against
          # the installed SDK instead of the moving online recommendations.
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: '1'
        run: pnpm dlx expo-doctor@1.21.8

      - name: Report upstream Expo recommendations (advisory)
        continue-on-error: true
        run: pnpm dlx expo-doctor@1.21.8

  ios-bundle:
    name: ios-bundle (Hermes bundle via expo export)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Corepack >= 0.36 (runner image Node, for cache key)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Set up Node.js (pinned in .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Corepack >= 0.36 (pinned Node prefix)
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Export iOS bundle
        run: pnpm exec expo export --platform ios --output-dir dist/ios-bundle-ci

      - name: Verify bundle artifact
        run: ls -la dist/ios-bundle-ci/_expo/static/js/ios/
